<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sistema</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1>Login</h1>

        <form action="login" method="post">

            <div>
                <label for="email">E-mail:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required>
            </div>

            <div>
                <label for="senha">Senha:</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    required>
            </div>

            <button type="submit">
                Entrar
            </button>

        </form>

    </main>

</body>

</html>
